name: "ETL Diario: Azure SQL to Supabase"

on:
  schedule:
    - cron: '0 5 * * *'   # 00:00 AM Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner a ejecutar'
        required: false
        default: 'all'
        type: choice
        options: ['all','emssanar','sura','nuevaeps','asmetsalud','dispensario']

env:
  MSSQL_HOST:      ${{ secrets.MSSQL_HOST }}
  MSSQL_DB:        ${{ secrets.MSSQL_DB }}
  MSSQL_USER:      ${{ secrets.MSSQL_USER }}
  MSSQL_PASS:      ${{ secrets.MSSQL_PASS }}
  PG_HOST:         ${{ secrets.PG_HOST }}
  PG_DB:           ${{ secrets.PG_DB }}
  PG_USER:         ${{ secrets.PG_USER }}
  PG_PASS:         ${{ secrets.PG_PASS }}
  PG_PORT:         '5432'
  ETL_MESES_ATRAS: '3'
  ETL_BATCH_SIZE:  '500'
  ETL_TIMEZONE:    'America/Bogota'
  ETL_LOG_LEVEL:   '1'

# Pasos reutilizables via composite (evita repeticion)
jobs:

  etl-emssanar:
    name: "ETL 1/5 - Emssanar"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.runner == 'all' ||
      github.event.inputs.runner == 'emssanar'
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 > /dev/null
          echo "ODBC Driver installed successfully"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, sqlsrv, pdo_sqlsrv
      - name: Run ETL Emssanar
        working-directory: etl
        run: php runners/emssanar.php

  etl-sura:
    name: "ETL 2/5 - SURA"
    runs-on: ubuntu-latest
    needs: etl-emssanar
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event.inputs.runner == 'all' ||
       github.event.inputs.runner == 'sura')
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 > /dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, sqlsrv, pdo_sqlsrv
      - name: Run ETL SURA
        working-directory: etl
        run: php runners/sura.php

  etl-nuevaeps:
    name: "ETL 3/5 - Nueva EPS"
    runs-on: ubuntu-latest
    needs: etl-sura
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event.inputs.runner == 'all' ||
       github.event.inputs.runner == 'nuevaeps')
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 > /dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, sqlsrv, pdo_sqlsrv
      - name: Run ETL Nueva EPS
        working-directory: etl
        run: php runners/nuevaeps.php

  etl-asmetsalud:
    name: "ETL 4/5 - Asmet Salud"
    runs-on: ubuntu-latest
    needs: etl-nuevaeps
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event.inputs.runner == 'all' ||
       github.event.inputs.runner == 'asmetsalud')
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 > /dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, sqlsrv, pdo_sqlsrv
      - name: Run ETL Asmet Salud
        working-directory: etl
        run: php runners/asmetsalud.php

  etl-dispensario:
    name: "ETL 5/5 - Dispensario"
    runs-on: ubuntu-latest
    needs: etl-asmetsalud
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event.inputs.runner == 'all' ||
       github.event.inputs.runner == 'dispensario')
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 > /dev/null
          echo "MSSQL ODBC Driver 18 installed"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, sqlsrv, pdo_sqlsrv
      - name: Run ETL Dispensario
        working-directory: etl
        run: php runners/dispensario.php
